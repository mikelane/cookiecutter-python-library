[project]
name = "{{cookiecutter.__project_name}}"
version = "0.1.0"
description = "{{cookiecutter.short_description}}"
authors = [
    {name = "{{cookiecutter.author_name}}", email = "{{cookiecutter.author_email}}"}
]
readme = "README.md"
requires-python = ">={% if cookiecutter.python_version_min %}{{cookiecutter.python_version_min}}{% else %}3.11{% endif %}"
license = {text = "{% if cookiecutter.license == 'MIT' %}MIT{% elif cookiecutter.license == 'Apache-2.0' %}Apache-2.0{% elif cookiecutter.license == 'BSD-3-Clause' %}BSD-3-Clause{% else %}Proprietary{% endif %}"}
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
{%- if cookiecutter.include_runtime_contracts == 'y' %}
    "beartype>=0.22.9",
    "icontract>=2.7.3",
{%- endif %}
{%- if cookiecutter.include_dependency_injection == 'y' %}
    "dioxide>=2.0.1",
{%- endif %}
    "loguru>=0.7.3",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
{%- if cookiecutter.include_mutation_testing == 'y' %}
    "pytest-gremlins>=1.6.0",
{%- endif %}
{%- if cookiecutter.include_property_testing == 'y' %}
    "hypothesis>=6.151.9",
{%- endif %}
{%- if cookiecutter.include_bdd_testing == 'y' %}
    "pytest-bdd>=8.1.0",
{%- endif %}
{%- if cookiecutter.include_benchmarks == 'y' %}
    "pytest-benchmark>=5.2.3",
{%- endif %}
]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.7",
    "pre-commit>=4.5.1",
{%- if cookiecutter.project_type == 'rust-backed' %}
    "maturin>=1.12.6,<2.0",
{%- endif %}
]
{%- if cookiecutter.include_documentation == 'y' %}
docs = [
    "mkdocs-material>=9.6.14",
    "mkdocstrings[python]>=0.29.1",
]
{%- endif %}

{% if cookiecutter.project_type == 'rust-backed' -%}
[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "{{cookiecutter.__package_name}}._{{cookiecutter.__package_name}}_core"
features = ["pyo3/extension-module"]
{%- else -%}
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
{%- endif %}

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "-vvv",
    "-l",
    "--doctest-modules",
    "--color=yes",
    "--code-highlight=yes",
    "--cov",
    "--cov-branch",
    "--cov-fail-under=100",
    "--no-cov-on-fail",
    "--log-disable=faker",
    "--log-disable=asyncio",
]
testpaths = ["tests"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS"
]
python_functions = ["it_*", "test_*"]
log_cli = true
log_cli_level = "WARNING"
log_auto_indent = true

[tool.ruff]
line-length = 120
target-version = "py{% if cookiecutter.python_version_min == '3.11' %}311{% elif cookiecutter.python_version_min == '3.12' %}312{% elif cookiecutter.python_version_min == '3.13' %}313{% endif %}"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with ruff formatter
    "ISC001",  # Conflicts with ruff formatter
    "D203",    # Conflicts with D211
    "D213",    # Conflicts with D212
    "ANN101",  # Missing type annotation for self - not needed
    "TCH001",  # Move into type-checking block - beartype uses runtime checks
    "PLE1205", # Loguru uses template strings
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/**/*.py" = ["ANN201", "ANN001", "D100", "D103", "D104", "S101", "PLR2004"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
