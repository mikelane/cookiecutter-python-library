{% if cookiecutter.project_type == 'rust-backed' -%}
[package]
name = "{{cookiecutter.__project_name}}"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[lib]
name = "_{{cookiecutter.__package_name}}_core"
path = "rust/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py{% if cookiecutter.python_version_min == '3.11' %}311{% elif cookiecutter.python_version_min == '3.12' %}312{% elif cookiecutter.python_version_min == '3.13' %}313{% endif %}"] }

[dev-dependencies]

[profile.release]
opt-level = 3          # Maximum optimization
lto = "fat"            # Full link-time optimization
codegen-units = 1      # Single codegen unit for better optimization
strip = true           # Strip symbols (smaller binaries)
panic = "abort"        # No unwinding overhead
{%- endif %}
