[project]
name = "cookiecutter-python-library"
version = "0.2.0"
description = "A modern cookiecutter template for Python libraries"
authors = [
    {name = "Mike Lane", email = "mikelane@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cookiecutter>=2.7.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-cookies>=0.7.0",
    "pyyaml>=6.0.3",
]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.10",
    "pre-commit>=4.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hooks"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "-vvv",
    "-l",
    "--doctest-modules",
    "--color=yes",
    "--code-highlight=yes",
    "--cov=tests",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=90",
    "--no-cov-on-fail",
]
testpaths = ["tests"]
python_functions = ["it_*", "test_*"]
log_cli = true
log_cli_level = "WARNING"
log_auto_indent = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with ruff formatter
    "ISC001",  # Conflicts with ruff formatter
    "D203",    # Conflicts with D211
    "D213",    # Conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/**/*.py" = ["ANN201", "ANN001", "D100", "D103", "D104", "S101", "PLR2004"]
"hooks/**/*.py" = ["T201", "S603", "S607"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
